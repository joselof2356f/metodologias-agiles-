<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Iniciar Sesión - Your Alarm</title>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

    <header class="bg-blue-500 shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-around">
            <div class="text-2xl font-bold text-white">
                <a href="index.html">YourAlarm</a>
            </div>
            <div class="hidden md:flex items-center space-x-6 text-white">
                <a href="index.html" class="hover:text-black">Inicio</a>
                <a href="contacto.html" class="hover:text-black">Contacto</a>
            </div>
            <a href="index.html" class="bg-blue-900 text-white px-6 py-2 rounded-full hover:bg-black">Volver</a>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center py-10 px-4">
        <div class="container mx-auto max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden p-10">
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-slate-800">Bienvenido</h2>
                <p class="text-slate-500 mt-2">Ingresa a tu cuenta de Your Alarm</p>
            </div>

            <form action="#" class="space-y-6">
                <div>
                    <label class="block text-slate-700 font-semibold mb-2">Correo Electrónico</label>
                    <input type="email" placeholder="correo@ejemplo.com" required
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>
                
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-slate-700 font-semibold">Contraseña</label>
                        <a href="#" class="text-sm text-blue-600 hover:underline">¿La olvidaste?</a>
                    </div>
                    <input type="password" placeholder="••••••••" required
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-slate-700">Recordar sesión</label>
                </div>

                <button type="submit" 
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-black transition shadow-lg uppercase tracking-wide">
                    Entrar
                </button>
            </form>

            <div class="mt-8 text-center text-slate-600">
                <p>¿No tienes cuenta? <a href="#" class="text-blue-600 font-bold hover:underline">Regístrate aquí</a></p>
            </div>

        </div>
    </main>

    <footer class="bg-blue-700 p-6 text-center text-white text-sm">
        &copy; 2026 Your Alarm de Confianza
    </footer>

</body>
</html>
