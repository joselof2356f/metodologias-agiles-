<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Contacto - Your Alarm</title>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

    <header class="bg-blue-500 shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-around">
            <div class="text-2xl font-bold text-white">
                <a href="index.html">YourAlarm</a>
            </div>
            <div class="hidden md:flex items-center space-x-6 text-white">
                <a href="index.html" class="hover:text-black">Inicio</a>
                <a href="#" class="hover:text-black font-bold border-b-2 border-white">Contacto</a>
            </div>
            <a href="index.html" class="bg-blue-900 text-white px-6 py-2 rounded-full hover:bg-black">Volver</a>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center py-20 px-4">
        <div class="container mx-auto max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2">
                
                <div class="bg-blue-600 p-10 text-white flex flex-col justify-center">
                    <h2 class="text-3xl font-bold mb-6">contactanos si tienes alguna duda</h2>
                    <p class="text-blue-100 mb-8 text-lg">
                        Si tienes dudas sobre cómo usar la app o quieres ayudar a un familiar, escríbenos.
                    </p>
                    <div class="space-y-4">
                        <p> Medellín, Antioquia</p>
                        <p> +57 300 123 4567</p>
                        <p> soporte@youralarm.com</p>
                    </div>
                </div>

                <div class="p-10">
                    <form action="#" class="space-y-5">
                        <div>
                            <label class="block text-slate-700 font-semibold mb-2">Nombre Completo</label>
                            <input type="text" placeholder="Ej. Juan Pérez" required
                                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-slate-700 font-semibold mb-2">Correo Electrónico</label>
                            <input type="email" placeholder="correo@ejemplo.com" required
                                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-slate-700 font-semibold mb-2">Mensaje</label>
                            <textarea rows="4" placeholder="¿En qué te ayudamos?" required
                                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></textarea>
                        </div>
                        <button type="submit" 
                            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-black transition shadow-lg">
                            ENVIAR MENSAJE
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-blue-700 p-6 text-center text-white text-sm">
        &copy; 2026 Your Alarm de Confianza
    </footer>

</body>
</html>
